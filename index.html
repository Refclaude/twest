<!DOCTYPE html>
<html lang="id" data-theme="sekolah">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Portal Internal Sekolah</title>
  <link rel="preload" href="./assets/fonts/PlusJakartaSans-Variable-Latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/layout.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="#/beranda" class="brand" id="brandLink">
        <span class="brand-logo" aria-hidden="true">PS</span>
        <span id="brandNameText">Portal Internal Sekolah</span>
      </a>

      <nav class="main-nav" aria-label="Navigasi Utama" id="mainNav">
        <a href="#/beranda" class="nav-link" data-route="#/beranda">Beranda</a>
        <a href="#/kuis" class="nav-link" data-route="#/kuis">Kuis</a>
        <a href="#/avatar" class="nav-link" data-route="#/avatar">Avatar</a>
        <a href="#/admin" class="nav-link" data-route="#/admin" id="navAdmin">Admin</a>
        <button type="button" class="ds-btn ds-btn--outline" id="themeCycleBtn" title="Ganti Tema">Tema</button>
        <button type="button" class="ds-btn ds-btn--ghost is-hidden" id="logoutBtn">Keluar</button>
      </nav>
    </div>
  </header>

  <main class="main-container" id="appMain" tabindex="-1"></main>
  <div id="overlayRoot"></div>
  <div class="ds-toast-region" id="toastRegion" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
